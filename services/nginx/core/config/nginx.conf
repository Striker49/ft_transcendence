# User and Worker Processes
user nginx;
worker_processes auto;

# Enable PCRE JIT for regex
pcre_jit on;

events {
    # Max simultaneous connections per worker
    worker_connections 1024;
}

http {

    # MIME Types and Default File Type
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging Configuration
    error_log /var/log/nginx/error.log warn;
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    # Basic Security and Performance Settings
    server_tokens off;
    client_max_body_size 1m;
    sendfile on;
    tcp_nopush on;

    # SSL Settings
    ssl_protocols TLSv1.1 TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:2m;
    ssl_session_timeout 1h;
    ssl_session_tickets off;

    # gzip Settings
    gzip_vary on;

    # Helper variable for WebSocket proxying
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # Redirect HTTP to HTTPS
    server {
        listen 80;
        listen [::]:80;
        server_name 0.0.0.0 localhost;

        # Redirect all HTTP requests to HTTPS
        return 301 https://$host$request_uri;
    }

    # Default HTTPS Server Block
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name localhost;
        client_body_buffer_size 1000k;

        ssl_certificate /etc/nginx/ssl/nginx.crt;
        ssl_certificate_key /etc/nginx/ssl/nginx.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        # Static File Serving
        location /static/ {
            alias /code/core/static/;
            expires 30d;
            add_header Cache-Control "public";
        }

        location /api/media/ {
            alias /code/core/mediafiles/;
            expires 30d;
            add_header Cache-Control "public";
        }

        # Proxy Frontend Requests
        location / {
            proxy_pass http://frontend:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
        }

        # Proxy API Requests to Django
        location /api/ {
            proxy_pass http://django:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
        }
    }
}